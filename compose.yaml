services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tapoo
      POSTGRES_PASSWORD: tapoo
      POSTGRES_DB: tapoo
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapoo -d tapoo"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # No compose os dados ficam no Postgres acima; o .env pode sobrescrever.
      REPO: ${REPO:-sql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tapoo:tapoo@db:5432/tapoo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dados-postgres:
