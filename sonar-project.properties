# Keep this key aligned with the project created in SonarQube.
sonar.projectKey=projeto-tapoo_projeto-tapoo
sonar.projectName=Projeto TAPOO
sonar.organization=projeto-tapoo
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py
sonar.exclusions=**/node_modules/**,frontend/dist/**,**/__pycache__/**

sonar.python.version=3.12

# Coverage is intentionally deferred for the initial project phase.
sonar.coverage.exclusions=**/*
