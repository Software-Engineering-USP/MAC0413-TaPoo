services:
  - type: web
    name: tapoo-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: ANA_IDENTIFICADOR
        sync: false
      - key: ANA_SENHA
        sync: false
      - key: CORS_ORIGENS
        sync: false
      - key: ANA_BASE_URL
        value: https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas
      - key: ANA_TIMEOUT_SEGUNDOS
        value: "20"
      - key: REPO
        value: sql
      - key: DATABASE_URL
        fromDatabase:
          name: tapoo-db
          property: connectionString

databases:
  - name: tapoo-db
    plan: free
    region: virginia
    databaseName: tapoo
    user: tapoo
