server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos do Vite têm hash no nome: um build novo gera nomes novos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html aponta para os assets do build atual; o navegador precisa
    # revalidá-lo a cada carga, senão continua usando o build anterior (#173).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
